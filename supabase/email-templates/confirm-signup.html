<!-- Paste into Supabase: Authentication > Email Templates > "Confirm signup"
     Subject suggestion: Your PLUTONIC verification code
     {{ .Token }} is the 6-digit code (it must be in the body for the app's code screen to work). -->
<div style="background:#090909;padding:32px 16px;font-family:Arial,Helvetica,sans-serif;">
  <div style="max-width:440px;margin:0 auto;background:#F2F0EB;padding:32px;text-align:center;color:#090909;">
    <div style="letter-spacing:6px;font-size:20px;margin-bottom:24px;">PLUTONIC</div>
    <p style="font-size:15px;margin:0 0 16px;">Use this code to confirm your account:</p>
    <div style="font-size:36px;letter-spacing:10px;font-weight:bold;margin:8px 0 24px;">{{ .Token }}</div>
    <p style="font-size:13px;color:#4A4844;margin:0;">It expires in 1 hour. If you didn't create a PLUTONIC account, you can ignore this email.</p>
  </div>
</div>
